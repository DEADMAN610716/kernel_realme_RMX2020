          CONFIG_USB_CONFIGFS_F_HID=y
          CONFIG_USB_CONFIGFS_F_UAC1=y
          CONFIG_USB_CONFIGFS_F_UAC2=y
          CONFIG_USB_CONFIGFS_F_MIDI=y
          CONFIG_USB_CONFIGFS_F_PRINTER=y
          CONFIG_USB_F_HID=y
          CONFIG_USB_F_MASS_STORAGE=y
          CONFIG_USB_F_SERIAL=y
          CONFIG_USB_F_ACM=y
          CONFIG_USB_F_NCM=y
          CONFIG_USB_F_ECM=y
          CONFIG_USB_F_RNDIS=y
          CONFIG_USB_F_EEM=y
          CONFIG_USB_F_UAC1=y
          CONFIG_USB_F_UAC2=y
          CONFIG_USB_F_MIDI=y
          CONFIG_USB_F_PRINTER=y

          # ---- USB host: storage, serial, network ----
          CONFIG_USB_STORAGE=y
          CONFIG_USB_UAS=y
          CONFIG_USB_SERIAL=y
          CONFIG_USB_SERIAL_CH341=y
          CONFIG_USB_SERIAL_CP210X=y
          CONFIG_USB_SERIAL_FTDI_SIO=y
          CONFIG_USB_SERIAL_PL2303=y
          CONFIG_USB_SERIAL_OPTION=y
          CONFIG_USB_ACM=y
          CONFIG_USB_USBNET=y
          CONFIG_USB_NET_CDC_EEM=y
          CONFIG_USB_NET_CDC_NCM=y
          CONFIG_USB_NET_CDC_MBIM=y
          CONFIG_USB_NET_RNDIS_HOST=y
          CONFIG_USB_NET_AX8817X=y
          CONFIG_USB_NET_AX88179_178A=y
          CONFIG_USB_NET_RTL8150=y
          CONFIG_USB_NET_RTL8152=y
          CONFIG_USB_NET_SMSC75XX=y
          CONFIG_USB_NET_SMSC95XX=y
          CONFIG_USB_NET_QMI_WWAN=y
          CONFIG_USB_MON=y

          # ---- Networking used by NetHunter tools ----
          CONFIG_TUN=y
          CONFIG_PACKET=y
          CONFIG_PACKET_DIAG=y
          CONFIG_UNIX_DIAG=y
          CONFIG_INET_DIAG=y
          CONFIG_INET_RAW_DIAG=y
          CONFIG_INET_UDP_DIAG=y
          CONFIG_BPF_SYSCALL=y
          CONFIG_BPF_JIT=y
          CONFIG_BPF_EVENTS=y
          CONFIG_NET_CLS_BPF=m
          CONFIG_NET_ACT_BPF=m
          CONFIG_NET_SCH_INGRESS=m
          CONFIG_NET_CLS_U32=m
          CONFIG_NET_CLS_MATCHALL=m
          CONFIG_NET_EMATCH=y
          CONFIG_NET_SCH_FQ_CODEL=m
          CONFIG_NET_SCH_HTB=m
          CONFIG_NET_SCH_NETEM=m
          CONFIG_NET_ACT_MIRRED=m
          CONFIG_NET_ACT_GACT=m
          CONFIG_NET_ACT_POLICE=m
          CONFIG_BRIDGE=m
          CONFIG_BRIDGE_VLAN_FILTERING=y
          CONFIG_BRIDGE_IGMP_SNOOPING=y
          CONFIG_VLAN_8021Q=m
          CONFIG_NET_IPGRE=m
          CONFIG_NET_IPIP=m
          CONFIG_IPV6_TUNNEL=m
          CONFIG_IPV6_SIT=m
          CONFIG_VXLAN=m
          CONFIG_MACVLAN=m
          CONFIG_MACVTAP=m
          CONFIG_IPVLAN=m
          CONFIG_VETH=m
          CONFIG_IP_NF_IPTABLES=y
          CONFIG_IP_NF_NAT=y
          CONFIG_IP_NF_TARGET_MASQUERADE=y
          CONFIG_IP_NF_TARGET_REDIRECT=m
          CONFIG_NETFILTER_XT_TARGET_MASQUERADE=m
          CONFIG_NETFILTER_XT_TARGET_REDIRECT=m
          CONFIG_NETFILTER_XT_TARGET_TEE=m
          CONFIG_NETFILTER_XT_MATCH_STATE=m
          CONFIG_NETFILTER_XT_MATCH_COMMENT=m
          CONFIG_NETFILTER_XT_MATCH_MULTIPORT=m
          CONFIG_NETFILTER_XT_MATCH_RECENT=m
          CONFIG_NETFILTER_XT_MATCH_CONNTRACK=m
          CONFIG_IP6_NF_NAT=m
          CONFIG_IP6_NF_TARGET_MASQUERADE=m
          CONFIG_NF_NAT=m

          # ---- Filesystems ----
          CONFIG_EXT4_FS=y
          CONFIG_EXT4_FS_POSIX_ACL=y
          CONFIG_EXT4_FS_SECURITY=y
          CONFIG_VFAT_FS=y
          CONFIG_EXFAT_FS=y
          CONFIG_NTFS3_FS=y
          CONFIG_NTFS_FS=y
          CONFIG_HFSPLUS_FS=m
          CONFIG_ISO9660_FS=y
          CONFIG_JOLIET=y
          CONFIG_ZISOFS=y
          CONFIG_UDF_FS=m
          CONFIG_SQUASHFS=y
          CONFIG_SQUASHFS_XZ=y
          CONFIG_FUSE_FS=y
          CONFIG_CONFIGFS_FS=y
          CONFIG_OVERLAY_FS=y
          CONFIG_MSDOS_FS=y

          # ---- CAN bus ----
          CONFIG_CAN=m
          CONFIG_CAN_RAW=m
          CONFIG_CAN_BCM=m
          CONFIG_CAN_GW=m
          CONFIG_CAN_VCAN=m
          CONFIG_CAN_VXCAN=m
          CONFIG_CAN_SLCAN=m
          CONFIG_CAN_DEV=m
          CONFIG_CAN_CALC_BITTIMING=y
          CONFIG_CAN_GS_USB=m
          CONFIG_CAN_KVASER_USB=m
          CONFIG_CAN_MCBA_USB=m
          CONFIG_CAN_PEAK_USB=m
          CONFIG_CAN_UCAN=m
          CONFIG_CAN_8DEV_USB=m
          CONFIG_CAN_EMS_USB=m
          CONFIG_CAN_ESD_USB=m
          CONFIG_CAN_ETAS_ES58X=m

          # ---- Force-feedback and gamepad support ----
          CONFIG_INPUT_FF_MEMLESS=y
          EOF

          cat > ci/config/modules.list <<'EOF'
          cfg80211
          mac80211
          mac80211_hwsim
          ath
          ath9k_common
          ath9k_hw
          ath9k
          ath9k_htc
          ath9k_hw
          ath9k_common
          ath6kl_core
          ath6kl_usb
          ath10k_core
          ath10k_usb
          ath10k_pci
          ath10k_sdio
          ath11k
          carl9170
          ath5k
          mt76
          mt76_usb
          mt76_sdio
          mt76_connac_lib
          mt76x0_common
          mt76x0u
          mt76x2u
          mt7603e
          mt7615e
          mt7663u
          mt7663s
          mt7915e
          mt7921e
          mt7921u
          mt7996e
          rt2x00lib
          rt2x00usb
          rt2500usb
          rt73usb
          rt2800lib
          rt2800usb
          zd1211rw
          b43
          brcmutil
          brcmfmac
          mwifiex
          mwifiex_usb
          mwifiex_sdio
          mwifiex_pcie
          libertas
          libertas_usb
          libertas_sdio
          wilc1000
          wilc1000_sdio
          wilc1000_spi
          rtl8187
          rtl8xxxu
          rtlwifi
          rtl_usb
          rtl8192c_common
          rtl8192cu
          rtl8192ce
          rtl8192se
          rtl8192de
          rtl8723ae
          rtl8723be
          rtl8188ee
          rtl8192ee
          rtl8821ae
          rtw88_core
          rtw88_usb
          rtw88_8821cu
          rtw88_8822bu
          rtw88_8822cu
          rtw88_8723du
          rtw88_8821ce
          rtw88_8822be
          rtw88_8822ce
          rtw88_8723de
          r8188eu
          r8712u
          bluetooth
          bnep
          rfcomm
          hidp
          btusb
          btsdio
          hci_uart
          hci_vhci
          btbcm
          btrtl
          btintel
          btqca
          btmrvl
          ath3k
          bcm203x
          bpa10x
          bfusb
          usb_f_hid
          usb_f_mass_storage
          usb_f_serial
          usb_f_acm
          usb_f_ecm
          usb_f_rndis
          usb_f_ncm
          usb_f_eem
          usb_f_uac1
          usb_f_uac2
          usb_f_midi
          usb_f_printer
          usb_f_fs
          hid_playstation
          xpad
          uinput
          joydev
          cls_bpf
          act_bpf
          sch_ingress
          cls_u32
          cls_matchall
          sch_fq_codel
          sch_htb
          sch_netem
          act_mirred
          act_gact
          act_police
          bridge
          8021q
          ip_gre
          ipip
          ip6_tunnel
          sit
          vxlan
          macvlan
          macvtap
          ipvlan
          veth
          xt_masquerade
          xt_redirect
          xt_TEE
          xt_state
          xt_comment
          xt_multiport
          xt_recent
          xt_conntrack
          nf_nat
          hfsplus
          udf
          can
          can_raw
          can_bcm
          can_gw
          vcan
          vxcan
          slcan
          can_dev
          gs_usb
          kvaser_usb
          mcba_usb
          peak_usb
          ucan
          8dev_usb
          ems_usb
          esd_usb2
          etas_es58x
          cdc_mbim
          qmi_wwan
          EOF

          cat > ci/anykernel/anykernel.sh <<'EOF'
          properties() { '
          kernel.string=Realme Narzo 30A/20 NH kernel
          do.devicecheck=0
          do.modules=0
          do.systemless=1
          do.cleanup=1
          device.name1=
          device.name2=
          supported.versions=
          '; }

          block=/dev/block/bootdevice/by-name/boot;
          is_slot_device=0;
          ramdisk_compression=auto;

          . tools/ak3-core.sh;

          dump_boot;
          write_boot;
          EOF

          cat > ci/magisk/module.prop <<'EOF'
          id=nethunter-modules-narzo30a20
          name=Realme Narzo 30A/20 NetHunter Modules
          version=v1.0
          versionCode=1
          author=nethunter-build
          description=Loads NetHunter Wi-Fi, Bluetooth, and USB gadget modules for the Realme Narzo 30A/20 NH kernel.
          EOF

          cat > ci/magisk/service.sh <<'EOF'
          #!/system/bin/sh
          MODDIR=${0%/*}
          LOG=/data/local/tmp/nethunter-modules.log
          exec >>"$LOG" 2>&1

          KREL=$(uname -r)
          EXPECT=$(cat "$MODDIR/kernel.release" 2>/dev/null)
          echo "== $(date) running kernel $KREL, module built for $EXPECT"

          if [ "$KREL" != "$EXPECT" ]; then
            echo "Kernel mismatch. Flash the matching NH kernel first. Skipping modules."
            exit 0
          fi

          MODS=$(ls "$MODDIR"/lib/modules/"$KREL"/*.ko 2>/dev/null)
          for pass in 1 2 3 4 5 6 7 8; do
            for f in $MODS; do
              n=$(basename "$f" .ko | tr - _)
              grep -q "^$n " /proc/modules && continue
              insmod "$f" 2>/dev/null
            done
          done
          echo "Loaded modules:"
          cut -d' ' -f1 /proc/modules

          [ -f "$MODDIR/enable_permissive" ] && setenforce 0 && echo "SELinux set to permissive"

          if [ -f "$MODDIR/enable_hid" ]; then
            mount | grep -q configfs || mount -t configfs none /config
            for u in /config/usb_gadget/*; do echo "" > "$u/UDC" 2>/dev/null; done
            G=/config/usb_gadget/nethunter
            mkdir -p "$G" && cd "$G" || exit 1
            echo 0x1d6b > idVendor; echo 0x0104 > idProduct
            mkdir -p strings/0x409
            echo nethunter > strings/0x409/serialnumber
            echo Kali > strings/0x409/manufacturer
            echo "NetHunter HID" > strings/0x409/product
            mkdir -p configs/c.1/strings/0x409
            echo "HID" > configs/c.1/strings/0x409/configuration
            mkdir -p functions/hid.usb0
            echo 1 > functions/hid.usb0/protocol
            echo 1 > functions/hid.usb0/subclass
            echo 8 > functions/hid.usb0/report_length
            printf '\x05\x01\x09\x06\xa1\x01\x05\x07\x19\xe0\x29\xe7\x15\x00\x25\x01\x75\x01\x95\x08\x81\x02\x95\x01\x75\x08\x81\x01\x95\x05\x75\x01\x05\x08\x19\x01\x29\x05\x91\x02\x95\x01\x75\x03\x91\x01\x95\x06\x75\x08\x15\x00\x25\x65\x05\x07\x19\x00\x29\x65\x81\x00\xc0' \
              > functions/hid.usb0/report_desc
            ln -sf "$G/functions/hid.usb0" configs/c.1/
            UDC_NAME=$(ls /sys/class/udc | head -1)
            echo "$UDC_NAME" > UDC && echo "HID gadget bound to $UDC_NAME"
          fi
          EOF

      - name: Fetch toolchain (proton-clang)
        run: |
          git clone --depth 1 "$TOOLCHAIN_REPO" /tmp/clang
          CLANG_BIN=$(dirname "$(find /tmp/clang -name clang -type f | head -1)")
          echo "$CLANG_BIN" >> "$GITHUB_PATH"
          "$CLANG_BIN/clang" --version

      - name: Clone kernel source
        run: |
          git clone --depth 1 "$KERNEL_REPO" kernel

      - name: Configure kernel
        working-directory: kernel
        run: |
          DEF=$(ls arch/arm64/configs | grep -iE 'rmx2020|6768|6769|6765' | head -1)
          if [ -z "$DEF" ]; then
            echo "::error::No matching defconfig found. Files were:"; ls arch/arm64/configs; exit 1
          fi
          echo "Using defconfig: $DEF"
          echo "DEFCONFIG=$DEF" >> "$GITHUB_ENV"
          make $MAKE_FLAGS "$DEF"
          ./scripts/kconfig/merge_config.sh -m -O out out/.config ../ci/config/nethunter.config
          make $MAKE_FLAGS olddefconfig

      - name: Verify required symbols
        working-directory: kernel
        run: |
          fail=0
          for s in CONFIG_MODULES CONFIG_CFG80211 CONFIG_MAC80211 CONFIG_USB_GADGET \
                   CONFIG_USB_CONFIGFS CONFIG_USB_CONFIGFS_F_HID CONFIG_TUN \
                   CONFIG_BT CONFIG_BT_HIDP CONFIG_UHID CONFIG_HIDRAW; do
            if ! grep -qE "^$s=(y|m)" out/.config; then
              echo "::error::MISSING $s"; fail=1
            fi
          done
          exit $fail

      - name: Build kernel and modules
        working-directory: kernel
        run: |
          make $MAKE_FLAGS -j"$(nproc)" modules
          make $MAKE_FLAGS -j"$(nproc)" Image.gz-dtb || \
          make $MAKE_FLAGS -j"$(nproc)" Image.gz || \
          make $MAKE_FLAGS -j"$(nproc)" Image
          cat out/include/config/kernel.release > ../kernel.release
          echo "KREL=$(cat ../kernel.release)" >> "$GITHUB_ENV"
          echo "Kernel release: $(cat ../kernel.release)"

      - name: Stage NetHunter modules
        run: |
          STAGE=stage/lib/modules/$KREL
          mkdir -p "$STAGE"
          find kernel/out -name '*.ko' | while read -r f; do
            b=$(basename "$f" .ko); b=${b//-/_}
            if grep -qx "$b" ci/config/modules.list; then
              cp "$f" "$STAGE/"
            fi
          done
          echo "Staged $(ls "$STAGE" | wc -l) modules"
          ls "$STAGE"

      - name: Package flashable kernel zip (AnyKernel3)
        run: |
          IMG=""
          for c in Image.gz-dtb Image.gz Image; do
            if [ -f "kernel/out/arch/arm64/boot/$c" ]; then IMG=$c; break; fi
          done
          if [ -z "$IMG" ]; then echo "::error::No kernel image produced"; exit 1; fi
          git clone --depth 1 https://github.com/osm0sis/AnyKernel3.git anykernel
          cp ci/anykernel/anykernel.sh anykernel/anykernel.sh
          cp "kernel/out/arch/arm64/boot/$IMG" anykernel/
          mkdir -p dist
          (cd anykernel && zip -qr9 "../dist/nethunter-kernel-narzo30a20-$KREL.zip" . -x '.git*')

      - name: Package NetHunter module (Magisk/KSU/APatch)
        run: |
          M=magisk_build
          rm -rf "$M" && mkdir -p "$M/lib/modules/$KREL"
          cp ci/magisk/module.prop ci/magisk/service.sh "$M/"
          cp stage/lib/modules/$KREL/*.ko "$M/lib/modules/$KREL/"
          echo "$KREL" > "$M/kernel.release"
          mkdir -p dist
          (cd "$M" && zip -qr9 "../dist/nethunter-modules-narzo30a20-$KREL.zip" .)

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nethunter-narzo30a20-${{ github.run_number }}
          path: dist/*.zip

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nh-narzo30a20-${{ github.run_number }}
          name: Realme Narzo 30A/20 NH kernel build ${{ github.run_number }}
          body: "Flash the kernel zip in TWRP first, then install the module zip in Magisk, KernelSU, or APatch, and reboot."
          files: dist/*.zip
