name: "Realme Narzo 30A/20 NH kernel"

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  KERNEL_NAME: "Realme Narzo 30A/20 NH kernel"
  KERNEL_REPO: "https://github.com/dp00xd/kernel_realme_RMX2020.git"
  TOOLCHAIN_REPO: "https://github.com/kdrag0n/proton-clang.git"
  MAKE_FLAGS: "ARCH=arm64 LLVM=1 O=out"

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 300
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android || true
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev libelf-dev \
            build-essential python3 zip unzip kmod cpio rsync libncurses-dev git wget

      - name: Write NetHunter project files
        run: |
          mkdir -p ci/config ci/anykernel ci/magisk

          cat > ci/config/nethunter.config <<'EOF'
          CONFIG_LOCALVERSION="-NH-Narzo30A20"
          CONFIG_LOCALVERSION_AUTO=n
          CONFIG_MODULES=y
          CONFIG_MODULE_UNLOAD=y
          CONFIG_MODVERSIONS=n
          CONFIG_MODULE_SIG=n
          CONFIG_MODULE_SIG_FORCE=n

          # ---- Core networking and wireless ----
          CONFIG_WLAN=y
          CONFIG_WLAN_VENDOR_REALTEK=y
          CONFIG_WLAN_VENDOR_ATH=y
          CONFIG_WLAN_VENDOR_RALINK=y
          CONFIG_WLAN_VENDOR_MEDIATEK=y
          CONFIG_WLAN_VENDOR_BROADCOM=y
          CONFIG_WLAN_VENDOR_MARVELL=y
          CONFIG_WLAN_VENDOR_ZYDAS=y
          CONFIG_WLAN_VENDOR_ATMEL=y
          CONFIG_WLAN_VENDOR_INTERSIL=y
          CONFIG_WLAN_VENDOR_TI=y
          CONFIG_CFG80211=y
          CONFIG_CFG80211_WEXT=y
          CONFIG_LIB80211=y
          CONFIG_MAC80211=y
          CONFIG_NL80211_TESTMODE=y
          CONFIG_MAC80211_HWSIM=m

          # ---- Atheros ----
          CONFIG_ATH_COMMON=m
          CONFIG_ATH9K_COMMON=m
          CONFIG_ATH9K_HW=m
          CONFIG_ATH9K=m
          CONFIG_ATH9K_HTC=m
          CONFIG_ATH9K_USB=m
          CONFIG_ATH6KL=m
          CONFIG_ATH6KL_USB=m
          CONFIG_ATH10K=m
          CONFIG_ATH10K_USB=m
          CONFIG_ATH10K_PCI=m
          CONFIG_ATH10K_SDIO=m
          CONFIG_ATH11K=m
          CONFIG_ATH11K_PCI=m
          CONFIG_CARL9170=m
          CONFIG_ATH5K=m

          # ---- MediaTek USB/PCIe ----
          CONFIG_MT76_CORE=m
          CONFIG_MT76_USB=m
          CONFIG_MT76_SDIO=m
          CONFIG_MT76_CONNAC_LIB=m
          CONFIG_MT76x0U=m
          CONFIG_MT76x2U=m
          CONFIG_MT7603E=m
          CONFIG_MT7615E=m
          CONFIG_MT7663U=m
          CONFIG_MT7663S=m
          CONFIG_MT7915E=m
          CONFIG_MT7921E=m
          CONFIG_MT7921U=m
          CONFIG_MT7996E=m

          # ---- Ralink / Zydas / other USB chipsets ----
          CONFIG_RT2X00=m
          CONFIG_RT2500USB=m
          CONFIG_RT73USB=m
          CONFIG_RT2800USB=m
          CONFIG_RT2800USB_RT33XX=y
          CONFIG_RT2800USB_RT35XX=y
          CONFIG_RT2800USB_RT3573=y
          CONFIG_RT2800USB_RT53XX=y
          CONFIG_RT2800USB_RT55XX=y
          CONFIG_RT2800USB_UNKNOWN=y
          CONFIG_ZD1211RW=m
          CONFIG_USB_NET_RNDIS_WLAN=m
          CONFIG_USB_ZD1201=m
          CONFIG_B43=m
          CONFIG_B43_PHY_N=y
          CONFIG_B43_PHY_LP=y
          CONFIG_B43_PHY_HT=y
          CONFIG_BRCMUTIL=m
          CONFIG_BRCMFMAC=m
          CONFIG_BRCMFMAC_USB=y
          CONFIG_BRCMFMAC_SDIO=y
          CONFIG_BRCMFMAC_PCIE=y
