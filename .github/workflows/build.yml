name: Build Realme Narzo 30A/20 NH kernel

on:
  workflow_dispatch:
    inputs:
      kernel_branch:
        description: "Kernel source branch (leave empty for default)"
        required: false
        default: ""

env:
  KERNEL_NAME: "Realme Narzo 30A/20 NH kernel"
  KERNEL_REPO: "https://github.com/dp00xd/kernel_realme_RMX2020.git"
  TOOLCHAIN_REPO: "https://github.com/kdrag0n/proton-clang.git"
  ANYKERNEL_REPO: "https://github.com/osm0sis/AnyKernel3.git"
  MAKE_FLAGS: "ARCH=arm64 SUBARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1"

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    permissions:
      contents: read

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git make bc bison flex libssl-dev libelf-dev build-essential \
            python3 kmod cpio rsync xz-utils zip unzip wget libncurses-dev

      - name: Fetch toolchain (proton-clang)
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth=1 "$TOOLCHAIN_REPO" "$GITHUB_WORKSPACE/clang"
          if [ ! -x "$GITHUB_WORKSPACE/clang/bin/clang" ]; then
            echo "::error::clang not found at clang/bin/clang"
            ls -la "$GITHUB_WORKSPACE/clang"
            exit 1
          fi
          echo "$GITHUB_WORKSPACE/clang/bin" >> "$GITHUB_PATH"
          clang --version

      - name: Fetch kernel source
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${{ github.event.inputs.kernel_branch }}" ]; then
            git clone --depth=1 --branch "${{ github.event.inputs.kernel_branch }}" \
              "$KERNEL_REPO" "$GITHUB_WORKSPACE/kernel"
          else
            git clone --depth=1 "$KERNEL_REPO" "$GITHUB_WORKSPACE/kernel"
          fi

      - name: Fetch AnyKernel3
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth=1 "$ANYKERNEL_REPO" "$GITHUB_WORKSPACE/AnyKernel3"

      - name: Detect defconfig
        id: defconfig
        shell: bash
        working-directory: kernel
        run: |
          set -euo pipefail
          CONFIG_DIR=arch/arm64/configs
          FOUND=""
          for KEY in rmx2020 6768 6769 6765; do
            MATCH=$(ls "$CONFIG_DIR" | grep -i "$KEY" | grep '_defconfig$' | head -n1 || true)
            if [ -n "$MATCH" ]; then
              FOUND="$MATCH"
              echo "Matched '$KEY' -> $MATCH"
              break
            fi
          done
          if [ -z "$FOUND" ]; then
            echo "::error::No defconfig matched rmx2020/6768/6769/6765"
            ls "$CONFIG_DIR" | grep -i defconfig || true
            exit 1
          fi
          echo "name=$FOUND" >> "$GITHUB_OUTPUT"

      - name: Write NetHunter config fragment
        shell: bash
        working-directory: kernel
        run: |
          set -euo pipefail
          cat > nethunter.fragment <<'EOF'
          # Module loading
          CONFIG_MODULES=y
          CONFIG_MODULE_UNLOAD=y
          CONFIG_MODULE_FORCE_UNLOAD=y
          CONFIG_MODULE_SIG=n

          # Core wireless stack (built in)
          CONFIG_WLAN=y
          CONFIG_CFG80211=y
          CONFIG_CFG80211_WEXT=y
          CONFIG_MAC80211=y
          CONFIG_USB_NET_DRIVERS=y

          # Atheros Wi-Fi (modules)
          CONFIG_ATH5K=m
          CONFIG_ATH6KL=m
          CONFIG_ATH9K=m
          CONFIG_ATH9K_HTC=m
          CONFIG_ATH9K_COMMON=m
          CONFIG_ATH9K_HW=m
          CONFIG_ATH10K=m
          CONFIG_CARL9170=m

          # Ralink / MediaTek USB Wi-Fi (modules)
          CONFIG_RT2X00=m
          CONFIG_RT2500USB=m
          CONFIG_RT73USB=m
          CONFIG_RT2800USB=m
          CONFIG_MT76_USB=m
          CONFIG_MT7601U=m
          CONFIG_MT76x0U=m
          CONFIG_MT76x2U=m

          # Realtek Wi-Fi (modules)
          CONFIG_RTL8187=m
          CONFIG_RTL8XXXU=m
          CONFIG_RTW88=m
          CONFIG_RTL8192CU=m

          # Other USB Wi-Fi (modules)
          CONFIG_ZD1211RW=m
          CONFIG_LIBERTAS=m
          CONFIG_MWIFIEX=m

          # USB gadget (built in)
          CONFIG_USB_GADGET=y
          CONFIG_USB_CONFIGFS=y
          CONFIG_USB_CONFIGFS_MASS_STORAGE=y
          CONFIG_USB_CONFIGFS_F_HID=y
          CONFIG_USB_F_HID=y
          CONFIG_USB_CONFIGFS_F_FS=y
          CONFIG_USB_CONFIGFS_NCM=y
          CONFIG_USB_CONFIGFS_ECM=y
          CONFIG_USB_CONFIGFS_RNDIS=y
          CONFIG_USB_CONFIGFS_ACM=y

          # CAN bus (modules)
          CONFIG_CAN=m
          CONFIG_CAN_RAW=m
          CONFIG_CAN_BCM=m
          CONFIG_CAN_GW=m
          CONFIG_CAN_VCAN=m
          CONFIG_CAN_SLCAN=m
          CONFIG_CAN_PEAK_USB=m
          CONFIG_CAN_KVASER_USB=m
          CONFIG_CAN_8DEV_USB=m
          CONFIG_CAN_ESD_USB=m
          CONFIG_CAN_EMS_USB=m

          # Bluetooth (modules)
          CONFIG_BT=m
          CONFIG_BT_RFCOMM=m
          CONFIG_BT_BNEP=m
          CONFIG_BT_HIDP=m
          CONFIG_BT_HCIBTUSB=m
          CONFIG_BT_HCIUART=m
          CONFIG_BT_HCIBCM203X=m
          CONFIG_BT_HCIBPA10X=m
          CONFIG_BT_HCIVHCI=m

          # Input, HID and gamepads (modules unless noted)
          CONFIG_UHID=y
          CONFIG_HIDRAW=y
          CONFIG_HID_GENERIC=y
          CONFIG_INPUT_FF_MEMLESS=y
          CONFIG_HID_PLAYSTATION=m
          CONFIG_HID_SONY=m
          CONFIG_HID_MICROSOFT=m
          CONFIG_HID_LOGITECH=m
          CONFIG_HID_NINTENDO=m
          CONFIG_JOYSTICK_XPAD=m
          CONFIG_JOYSTICK_XPAD_FF=y
          CONFIG_JOYSTICK_XPAD_LEDS=y

          # Networking used by the NetHunter tooling (built in)
          CONFIG_TUN=y
          CONFIG_PACKET=y
          CONFIG_NETFILTER=y
          CONFIG_NF_NAT=m
          CONFIG_IP_NF_IPTABLES=m
          CONFIG_IP6_NF_IPTABLES=m
          EOF

      - name: Configure kernel
        shell: bash
        working-directory: kernel
        run: |
          set -euo pipefail
          make O=out $MAKE_FLAGS "${{ steps.defconfig.outputs.name }}" 2>&1 | tee configure.log
          scripts/kconfig/merge_config.sh -m -O out out/.config nethunter.fragment 2>&1 | tee -a configure.log
          make O=out $MAKE_FLAGS olddefconfig 2>&1 | tee -a configure.log

      - name: Check symbols
        shell: bash
        working-directory: kernel
        run: |
          set -euo pipefail
          REQUIRED="CONFIG_MODULES CONFIG_CFG80211 CONFIG_MAC80211 CONFIG_USB_GADGET CONFIG_USB_CONFIGFS_F_HID CONFIG_TUN CONFIG_BT CONFIG_BT_HIDP CONFIG_UHID CONFIG_HIDRAW"
          MISSING=0
          for SYM in $REQUIRED; do
            if ! grep -qE "^${SYM}=(y|m)$" out/.config; then
              echo "::error::Required symbol ${SYM} is missing"
              MISSING=1
            fi
          done
          echo "--- Module-capable symbols that were NOT enabled ---"
          for SYM in $(grep -oE '^CONFIG_[A-Z0-9_]+=m' nethunter.fragment | cut -d= -f1); do
            if ! grep -qE "^${SYM}=m$" out/.config; then
              echo "::warning::${SYM} was not built as a module (not in this source tree?)"
            fi
          done
          exit $MISSING

      - name: Build kernel and modules
        shell: bash
        working-directory: kernel
        run: |
          set -euo pipefail
          JOBS=$(nproc)
          make O=out $MAKE_FLAGS -j"$JOBS" 2>&1 | tee build.log
          make O=out $MAKE_FLAGS -j"$JOBS" modules 2>&1 | tee -a build.log
          rm -rf "$GITHUB_WORKSPACE/modules_out"
          make O=out $MAKE_FLAGS INSTALL_MOD_PATH="$GITHUB_WORKSPACE/modules_out" modules_install 2>&1 | tee -a build.log

      - name: Select kernel image
        id: image
        shell: bash
        working-directory: kernel
        run: |
          set -euo pipefail
          BOOT=out/arch/arm64/boot
          for IMG in Image.gz-dtb Image.gz Image; do
            if [ -f "$BOOT/$IMG" ]; then
              echo "Using $IMG"
              cp "$BOOT/$IMG" "$GITHUB_WORKSPACE/AnyKernel3/"
              echo "name=$IMG" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "::error::No kernel image produced"
          ls -la "$BOOT" || true
          exit 1

      - name: Package kernel zip (AnyKernel3)
        shell: bash
        run: |
          set -euo pipefail
          KVER=$(cat "$GITHUB_WORKSPACE/kernel/out/include/config/kernel.release")
          echo "KVER=$KVER" >> "$GITHUB_ENV"
          cd "$GITHUB_WORKSPACE/AnyKernel3"
          # Keep the device check on. Set the device names only if the keys exist.
          if grep -q '^device.name1=' anykernel.sh; then
            sed -i 's/^device.name1=.*/device.name1=RMX2020/' anykernel.sh
          fi
          ZIP="NH-kernel-Narzo30A20-${KVER}.zip"
          zip -r9 "$GITHUB_WORKSPACE/$ZIP" . -x ".git*" -x "README*"
          echo "KERNEL_ZIP=$ZIP" >> "$GITHUB_ENV"

      - name: Package module zip (root manager + recovery)
        shell: bash
        run: |
          set -euo pipefail
          MOD_SRC="$GITHUB_WORKSPACE/modules_out/lib/modules"
          COUNT=$(find "$MOD_SRC" -name '*.ko' 2>/dev/null | wc -l)
          if [ "$COUNT" -eq 0 ]; then
            echo "::error::Build produced zero .ko files. Modules were not compiled."
            exit 1
          fi
          echo "Packaging $COUNT modules"

          MOD_DIR="$GITHUB_WORKSPACE/nh_modules"
          rm -rf "$MOD_DIR"
          mkdir -p "$MOD_DIR/system/lib/modules"
          find "$MOD_SRC" -name '*.ko' -exec cp {} "$MOD_DIR/system/lib/modules/" \;

          # Root manager metadata (Magisk / KernelSU / APatch)
          cat > "$MOD_DIR/module.prop" <<EOF
          id=nh_modules
          name=${KERNEL_NAME} modules
          version=${KVER}
          versionCode=1
          author=build
          description=NetHunter kernel modules for ${KVER}. Built for this kernel only.
          EOF

          # Load the modules at boot, only if the running kernel matches
          cat > "$MOD_DIR/service.sh" <<EOF
          #!/system/bin/sh
          MODDIR=\${0%/*}
          [ "\$(uname -r)" = "${KVER}" ] || exit 0
          for KO in "\$MODDIR"/system/lib/modules/*.ko; do
            insmod "\$KO" 2>/dev/null
          done
          EOF
          chmod 0755 "$MOD_DIR/service.sh"

          # Recovery (TWRP and similar) install
          mkdir -p "$MOD_DIR/META-INF/com/google/android"
          cat > "$MOD_DIR/META-INF/com/google/android/update-binary" <<EOF
          #!/sbin/sh
          OUTFD=\$2
          ZIP=\$3
          ui_print() { echo -e "ui_print \$1\nui_print" > /proc/self/fd/\$OUTFD; }
          ui_print "Installing ${KERNEL_NAME} modules for ${KVER}"
          if [ "\$(cat /proc/version | grep -o 'Linux version [^ ]*')" != "Linux version ${KVER}" ]; then
            ui_print "Warning: running kernel differs from ${KVER}"
          fi
          mount /system 2>/dev/null
          rm -rf /tmp/nh_mod && mkdir -p /tmp/nh_mod
          unzip -o "\$ZIP" 'system/*' -d /tmp/nh_mod || exit 1
          mkdir -p /system/lib/modules
          cp -f /tmp/nh_mod/system/lib/modules/*.ko /system/lib/modules/
          ui_print "Done. Reboot to load modules."
          exit 0
          EOF
          chmod 0755 "$MOD_DIR/META-INF/com/google/android/update-binary"

          cd "$MOD_DIR"
          MOD_ZIP="NH-modules-Narzo30A20-${KVER}.zip"
          zip -r9 "$GITHUB_WORKSPACE/$MOD_ZIP" .
          echo "MODULE_ZIP=$MOD_ZIP" >> "$GITHUB_ENV"

      - name: Upload kernel zip
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NH-kernel-${{ env.KVER || 'unknown' }}
          path: ${{ github.workspace }}/${{ env.KERNEL_ZIP }}
          if-no-files-found: warn

      - name: Upload module zip
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NH-modules-${{ env.KVER || 'unknown' }}
          path: ${{ github.workspace }}/${{ env.MODULE_ZIP }}
          if-no-files-found: warn

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            ${{ github.workspace }}/kernel/configure.log
            ${{ github.workspace }}/kernel/build.log
          if-no-files-found: warn
