          CONFIG_MWIFIEX_USB=m
          CONFIG_MWIFIEX_SDIO=m
          CONFIG_MWIFIEX_PCIE=m
          CONFIG_LIBERTAS=m
          CONFIG_LIBERTAS_USB=m
          CONFIG_LIBERTAS_SDIO=m
          CONFIG_LIBERTAS_THINFIRM=m
          CONFIG_WILC1000=m
          CONFIG_WILC1000_SDIO=m
          CONFIG_WILC1000_SPI=m

          # ---- Realtek: all mainline drivers, including partial monitor/injection ----
          CONFIG_RTL8187=m
          CONFIG_RTL8XXXU=m
          CONFIG_RTL8XXXU_UNTESTED=y
          CONFIG_RTLWIFI=m
          CONFIG_RTLWIFI_USB=m
          CONFIG_RTL8192CU=m
          CONFIG_RTL8192C_COMMON=m
          CONFIG_RTL8192CE=m
          CONFIG_RTL8192SE=m
          CONFIG_RTL8192DE=m
          CONFIG_RTL8723AE=m
          CONFIG_RTL8723BE=m
          CONFIG_RTL8188EE=m
          CONFIG_RTL8192EE=m
          CONFIG_RTL8821AE=m
          CONFIG_RTW88=m
          CONFIG_RTW88_CORE=m
          CONFIG_RTW88_USB=m
          CONFIG_RTW88_8821CU=m
          CONFIG_RTW88_8822BU=m
          CONFIG_RTW88_8822CU=m
          CONFIG_RTW88_8723DU=m
          CONFIG_RTW88_8821CE=m
          CONFIG_RTW88_8822BE=m
          CONFIG_RTW88_8822CE=m
          CONFIG_RTW88_8723DE=m
          CONFIG_R8188EU=m
          CONFIG_R8712U=m

          # ---- Bluetooth (matches drivers/bluetooth/Kconfig and net/bluetooth/Kconfig) ----
          CONFIG_BT=y
          CONFIG_BT_BREDR=y
          CONFIG_BT_LE=y
          CONFIG_BT_RFCOMM=m
          CONFIG_BT_RFCOMM_TTY=y
          CONFIG_BT_BNEP=m
          CONFIG_BT_HIDP=m
          CONFIG_BT_HCIBTUSB=m
          CONFIG_BT_HCIBTUSB_BCM=y
          CONFIG_BT_HCIBTUSB_RTL=y
          CONFIG_BT_HCIBTSDIO=m
          CONFIG_BT_HCIUART=m
          CONFIG_BT_HCIUART_H4=y
          CONFIG_BT_HCIUART_BCSP=y
          CONFIG_BT_HCIUART_LL=y
          CONFIG_BT_HCIUART_3WIRE=y
          CONFIG_BT_HCIUART_INTEL=y
          CONFIG_BT_HCIUART_BCM=y
          CONFIG_BT_HCIUART_QCA=y
          CONFIG_BT_HCIUART_ATH3K=y
          CONFIG_BT_HCIVHCI=m
          CONFIG_BT_MRVL=m
          CONFIG_BT_ATH3K=m
          CONFIG_BT_HCIBCM203X=m
          CONFIG_BT_HCIBPA10X=m
          CONFIG_BT_HCIBFUSB=m

          # ---- HID input: keyboard, mouse, gamepad, BT HID ----
          CONFIG_HID=y
          CONFIG_HID_GENERIC=y
          CONFIG_HIDRAW=y
          CONFIG_UHID=y
          CONFIG_USB_HID=y
          CONFIG_USB_HIDDEV=y
          CONFIG_HID_LOGITECH=y
          CONFIG_HID_LOGITECH_DJ=y
          CONFIG_HID_MICROSOFT=y
          CONFIG_HID_MAGICMOUSE=y
          CONFIG_HID_MULTITOUCH=y
          CONFIG_HID_SONY=y
          CONFIG_HID_PLAYSTATION=y
          CONFIG_HID_NINTENDO=y
          CONFIG_HID_ELAN=y
          CONFIG_HID_CHERRY=y
          CONFIG_HID_RAPOO=y
          CONFIG_HID_PRIMAX=y
          CONFIG_INPUT_FF_MEMLESS=y
          CONFIG_JOYSTICK_XPAD=m
          CONFIG_JOYSTICK_XPAD_FF=y
          CONFIG_JOYSTICK_XPAD_LEDS=y
          CONFIG_INPUT_UINPUT=y
          CONFIG_INPUT_EVDEV=y
          CONFIG_INPUT_MOUSEDEV=y
          CONFIG_INPUT_JOYDEV=m

          # ---- USB gadget (HID keyboard/mouse/gamepad, mass storage, network, serial, MIDI) ----
          CONFIG_USB_GADGET=y
          CONFIG_USB_CONFIGFS=y
          CONFIG_USB_CONFIGFS_UEVENT=y
          CONFIG_USB_CONFIGFS_SERIAL=y
          CONFIG_USB_CONFIGFS_ACM=y
